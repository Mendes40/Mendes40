name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate snake gif and svg
        uses: Platane/snk@v3
        with:
          github_user_name: Mendes40
          outputs: |
            dist/snake.gif?color_snake=00ff88&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_background=#0d1117
            dist/snake-dark.svg?palette=github-dark&color_snake=58a6ff

      - name: push snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
