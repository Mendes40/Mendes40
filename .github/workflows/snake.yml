name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate snake gif and svg
        uses: Platane/snk@v3
        with:
          github_user_name: Mendes40
          outputs: |
            dist/snake.gif?color_snake=%23FF1493&color_dots=#000000,#001100,#003300,#00aa00,#00ff41&color_background=#000000
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF1493

      - name: push snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
